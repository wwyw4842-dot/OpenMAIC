name: Chat hydration persistence
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert real chat hook does not dirty unchanged classroom data
        env:
          CHAT_HYDRATION_REPORT_DIR: ${{ runner.temp }}
        run: node scripts/test-chat-hydration.mjs
      - name: Preserve actual test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-hydration
          path: ${{ runner.temp }}/chat-hydration-*/
          if-no-files-found: error
          retention-days: 14
